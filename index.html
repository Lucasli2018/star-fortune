  /* ---------- 确定性随机 ---------- */
  function xfnv1a(str){
    var h = 2166136261>>>0;
    for(var i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 16777619); }
    return h>>>0;
  }
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a>>>15), 1 | a);
      t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
      return ((t ^ (t>>>14))>>>0) / 4294967296;
    };
  }
  function rng(seedStr){ return mulberry32(xfnv1a(seedStr)); }
  function pick(rnd, arr){ return arr[Math.floor(rnd()*arr.length)]; }

  /* ---------- 日期 / 周期 ---------- */
  function pad(n){ return n<10?'0'+n:''+n; }
  function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function weekRange(d){
    var day=(d.getDay()+6)%7; // 周一=0
    var mon=addDays(d,-day); var sun=addDays(mon,6);
    return {mon:mon,sun:sun};
  }
  function periodKey(c, mode, base){
    if(mode==='today') return ymd(base)+'|day';
    if(mode==='tomorrow') return ymd(addDays(base,1))+'|day';
    if(mode==='week'){ var w=weekRange(base); return base.getFullYear()+'-W'+pad(weekNum(base))+'|wk'; }
    if(mode==='month') return base.getFullYear()+'-'+pad(base.getMonth()+1)+'|mo';
    return ymd(base);
  }
  function weekNum(d){
    var t=new Date(d.getFullYear(),0,1); var day=(t.getDay()+6)%7;
    var days=Math.floor((d-t)/86400000)+day; return Math.floor(days/7)+1;
  }
  function periodLabel(mode, base){
    if(mode==='today') return '今日 · '+ (base.getMonth()+1)+'月'+base.getDate()+'日';
    if(mode==='tomorrow'){ var t=addDays(base,1); return '明日 · '+ (t.getMonth()+1)+'月'+t.getDate()+'日'; }
    if(mode==='week'){ var w=weekRange(base);
      return '本周 · '+ (w.mon.getMonth()+1)+'.'+w.mon.getDate()+'–'+(w.sun.getMonth()+1)+'.'+w.sun.getDate(); }
    if(mode==='month') return '本月 · '+base.getFullYear()+'年'+(base.getMonth()+1)+'月';
    return '';
  }

    var dim = {};
    DIMENSIONS.forEach(function(d){ dim[d.k] = 50 + Math.floor(r()*50); }); // 50-99
    var luckyNum = 1 + Math.floor(r()*9);
    var luckyColor = pick(r, LUCKY_COLORS);
    var pool = CONSTELLATIONS.filter(function(x){ return x.key!==c.key; });
    var pairC = pick(r, pool);

    // 详解文案

      return TEXTS[d.k][tier(dim[d.k])];
    }).join('');
    return {overall:overall, dim:dim, luckyNum:luckyNum, luckyColor:luckyColor,
            pair:c.name+' × '+pairC.name, pairKey:pairC.key, quote:quote, yi:yi, ji:ji, detail:detail};
  }

  /* ---------- 星空背景 ---------- */
  function starfield(){
    var cv=document.getElementById('stars'), ctx=cv.getContext('2d');
    var stars=[], shoot=null, lastShoot=0;
    function resize(){ cv.width=innerWidth; cv.height=innerHeight; build(); }
    function build(){
      stars=[]; var n=Math.round(innerWidth*innerHeight/9000);
      for(var i=0;i<n;i++){
        stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,
          r:Math.random()*1.4+0.3, a:Math.random(), s:Math.random()*0.02+0.004,
          hue: Math.random()<0.2 ? 45 : (Math.random()<0.5?210:270)});
      }
    }
    function tick(t){
      ctx.clearRect(0,0,cv.width,cv.height);
      for(var i=0;i<stars.length;i++){
        var st=stars[i]; st.a+=st.s; var tw=0.5+0.5*Math.sin(st.a);
        ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,Math.PI*2);
        ctx.fillStyle='hsla('+st.hue+',80%,'+(70+tw*20)+'%,'+(0.3+tw*0.7)+')';
        ctx.shadowBlur=6; ctx.shadowColor='hsla('+st.hue+',90%,80%,0.8)';
        ctx.fill();
      }
      ctx.shadowBlur=0;
      if(t-lastShoot>4000 && Math.random()<0.01){ shoot={x:-50,y:Math.random()*cv.height*0.5,len:0}; lastShoot=t; }
      if(shoot){
        shoot.x+=12; shoot.y+=6; shoot.len+=12;
        var g=ctx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.len,shoot.y-shoot.len*0.5);
        g.addColorStop(0,'rgba(255,255,255,0.9)'); g.addColorStop(1,'rgba(255,255,255,0)');
        ctx.strokeStyle=g; ctx.lineWidth=2; ctx.beginPath();
        ctx.moveTo(shoot.x,shoot.y); ctx.lineTo(shoot.x-shoot.len,shoot.y-shoot.len*0.5); ctx.stroke();
        if(shoot.x>cv.width+60) shoot=null;
      }
      requestAnimationFrame(tick);
    }
    addEventListener('resize', resize); resize(); requestAnimationFrame(tick);
  }

  function tarotOne(){
    var r = rng('T1|'+ymd(TODAY));
    var idx = Math.floor(r()*TAROT.length);
    var card = TAROT[idx];
    var rev = r() < 0.5;
    renderTarotCards([{card:card, rev:rev, pos:'今日指引'}], '今日一抽');
  }
  function tarotThree(){
    var r = rng('T3|'+ymd(TODAY));
    var pool = TAROT.slice();
    var chosen = [];
    var positions = ['过去','现在','未来'];
    for(var i=0;i<3;i++){
      var idx = Math.floor(r()*pool.length);
      var card = pool.splice(idx,1)[0];
      chosen.push({card:card, rev:r()<0.5, pos:positions[i]});
    }
    renderTarotCards(chosen, '三牌阵');
  }
  function renderTarotCards(cards, mode){
    var draw = document.getElementById('tarotDraw');
    draw.innerHTML = '';
    cards.forEach(function(c, i){
      var d = document.createElement('div');
      d.className = 'tarot-card';
      d.innerHTML = '<div class="tarot-inner">'+
        '<div class="tarot-face tarot-back"><div class="bk">✦</div><div class="bt">TAROT</div></div>'+
        '<div class="tarot-face tarot-front'+(c.rev?' rev':'')+'">'+
          '<div class="tnum">'+c.card.roman+'</div>'+
          '<div class="tsym">'+c.card.sym+'</div>'+
          '<div class="tnm">'+c.card.cn+'</div>'+
          '<div class="ten">'+c.card.en+'</div>'+
        '</div></div>';
      draw.appendChild(d);
      (function(el, delay){ setTimeout(function(){ el.classList.add('flipped'); }, delay); })(d, 200 + i*250);
      d.addEventListener('click', function(){ d.classList.toggle('flipped'); });
    });
    var read = document.getElementById('tarotRead');
    var html = '<h4>🔮 '+mode+' · 牌意解读</h4>';
    cards.forEach(function(c){
      var txt = c.rev ? c.card.rev : c.card.up;
      html += '<p><span class="rname">'+c.card.cn+(c.rev?'（逆位）':'（正位）')+'</span>'+
        '<span class="rtag">'+c.pos+'</span><br>'+txt+'</p>';
    });
    if(mode === '三牌阵'){
      html += '<p style="color:var(--text-dim);margin-top:10px">过去之牌映照来路，现在之牌映照当下，未来之牌映照可能。三张合观，方见全貌。</p>';
    } else {
      html += '<p style="color:var(--text-dim);margin-top:10px">一牌之谕，借你心中所问而显。信则有，疑则观，皆是照见自己的镜子。</p>';
    }
    read.innerHTML = html;
    read.style.display = 'block';
  }
  function initTarot(){
    document.getElementById('tarotOne').addEventListener('click', tarotOne);
    document.getElementById('tarotThree').addEventListener('click', tarotThree);
    document.getElementById('tarotReset').addEventListener('click', function(){
      document.getElementById('tarotDraw').innerHTML = '';
      document.getElementById('tarotRead').style.display = 'none';
    });
  }

  /* ---------- 启动 ---------- */
  function init(){
    try{
      var k=localStorage.getItem('star.key'); if(k&&BY_KEY[k]) current.key=k;
      var m=localStorage.getItem('star.mode'); if(m) current.mode=m;
    }catch(e){}
    renderGrid();
    initPairSelectors();
    initBirthday();
    renderPanel();
    renderPair();
    initTarot();
    starfield();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
