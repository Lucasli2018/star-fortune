<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>星语 · 星座运势</title>
<meta name="description" content="神秘星空风格的星座运势预测工具：今日/明日/本周/本月运势、分项指数、幸运要素、星座配对。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Orbitron:wght@500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg-0:#0B0C2A;
    --bg-1:#1A1040;
    --primary:#7C4DFF;
    --accent:#FFD54F;
    --ice:#4DD0E1;
    --pink:#F48FB1;
    --green:#81C784;
    --text:#F5F3FF;
    --text-dim:#B0A8D0;
    --card:rgba(255,255,255,0.06);
    --card-strong:rgba(255,255,255,0.10);
    --border:rgba(255,255,255,0.12);
    --glow:0 0 24px rgba(124,77,255,0.35);
    --radius:20px;
    --accent-element:var(--primary);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Noto Serif SC","Songti SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",serif;
    color:var(--text);
    background:radial-gradient(1200px 800px at 20% -10%, #241a5e 0%, transparent 55%),
               radial-gradient(1000px 700px at 90% 10%, #3a1d5e 0%, transparent 50%),
               linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 100%);
    background-attachment:fixed;
    min-height:100vh;
    overflow-x:hidden;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .nebula{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(600px 400px at 70% 80%, rgba(124,77,255,0.18), transparent 70%),
               radial-gradient(500px 360px at 15% 60%, rgba(77,208,225,0.12), transparent 70%);}
  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:28px 18px 60px}

  header.hero{text-align:center;padding:26px 0 10px}
  header.hero .badge{display:inline-block;font:600 12px/1 "Orbitron",sans-serif;letter-spacing:3px;
    color:var(--accent);border:1px solid var(--border);border-radius:999px;padding:8px 16px;
    background:var(--card);backdrop-filter:blur(8px);margin-bottom:18px;text-transform:uppercase}
  header.hero h1{font-family:"Cinzel","Noto Serif SC",serif;font-weight:700;font-size:clamp(32px,7vw,56px);
    letter-spacing:2px;
    background:linear-gradient(90deg,#fff,#FFD54F 60%,#F48FB1);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 30px rgba(255,213,79,0.25)}
  header.hero p{color:var(--text-dim);margin-top:10px;font-size:15px;letter-spacing:1px}

  .section-title{display:flex;align-items:center;gap:12px;margin:34px 0 16px;font-family:"Noto Serif SC",serif}
  .section-title h2{font-size:20px;font-weight:700;letter-spacing:1px}
  .section-title .line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
  .section-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:var(--glow)}

  /* 星座选择网格 */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:720px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}}
  .c-card{position:relative;cursor:pointer;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--card);backdrop-filter:blur(10px);padding:16px 10px;text-align:center;
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;overflow:hidden}
  .c-card:hover{transform:translateY(-4px);box-shadow:var(--glow);border-color:var(--c-accent,var(--primary))}
  .c-card.active{border-color:var(--c-accent,var(--primary));box-shadow:0 0 26px var(--c-glow,rgba(124,77,255,0.5));
    background:linear-gradient(160deg,var(--c-soft,rgba(124,77,255,0.18)),var(--card))}
  .c-card .sym{font-size:34px;line-height:1;color:var(--c-accent,var(--primary));text-shadow:0 0 16px var(--c-glow,rgba(124,77,255,0.5))}
  .c-card .nm{margin-top:8px;font-weight:700;font-size:15px}
  .c-card .dt{margin-top:2px;font-size:11px;color:var(--text-dim);font-family:"Orbitron",sans-serif}
  .c-card .el{position:absolute;top:8px;right:8px;font-size:10px;padding:2px 7px;border-radius:999px;
    background:var(--c-soft,rgba(124,77,255,0.2));color:var(--c-accent,var(--primary));border:1px solid var(--c-border,var(--border))}

  .tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
  .tools label{font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:8px}
  .tools input[type=date]{background:var(--card);border:1px solid var(--border);color:var(--text);
    border-radius:12px;padding:9px 12px;font-family:inherit;color-scheme:dark}
  .tools .hint{font-size:12px;color:var(--text-dim)}

  /* 结果面板 */
  .panel{margin-top:8px;border:1px solid var(--border);border-radius:24px;background:var(--card);
    backdrop-filter:blur(14px);padding:22px;box-shadow:0 10px 40px rgba(0,0,0,0.35)}
  .panel-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .panel-head .big-sym{font-size:54px;color:var(--accent-element);text-shadow:0 0 22px var(--c-glow,rgba(124,77,255,0.5))}
  .panel-head .meta h3{font-family:"Cinzel","Noto Serif SC",serif;font-size:24px}
  .panel-head .meta .sub{color:var(--text-dim);font-size:13px;margin-top:2px}
  .panel-head .meta .tags{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .tag{font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);background:var(--card-strong)}
  .period-tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}
  .period-tabs button{cursor:pointer;font-family:inherit;font-size:13px;color:var(--text-dim);
    background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 16px;transition:.2s}
  .period-tabs button.active{color:#1A1040;background:linear-gradient(90deg,var(--accent),#FFE9A8);
    border-color:transparent;font-weight:700;box-shadow:0 0 18px rgba(255,213,79,0.4)}

  .overall{display:flex;align-items:center;gap:20px;margin:6px 0 18px;flex-wrap:wrap}
  .ring{position:relative;width:120px;height:120px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .num b{font-family:"Orbitron",sans-serif;font-size:30px;color:var(--accent-element)}
  .ring .num span{font-size:11px;color:var(--text-dim)}
  .overall .desc{flex:1;min-width:220px}
  .overall .desc .lv{font-weight:700;font-size:16px;color:var(--accent)}
  .overall .desc p{color:var(--text-dim);font-size:13px;margin-top:4px}

  .bars{display:grid;gap:12px;margin:8px 0 4px}
  .bar-row{display:grid;grid-template-columns:60px 1fr 42px;align-items:center;gap:12px}
  .bar-row .bl{font-size:13px;color:var(--text)}
  .bar-track{height:10px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden}
  .bar-fill{height:100%;border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .bar-row .bv{font-family:"Orbitron",sans-serif;font-size:13px;text-align:right;color:var(--text)}

  .lucky{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
  @media(max-width:560px){.lucky{grid-template-columns:repeat(2,1fr)}}
  .lucky .item{border:1px solid var(--border);border-radius:16px;background:var(--card-strong);padding:14px;text-align:center}
  .lucky .item .k{font-size:12px;color:var(--text-dim)}
  .lucky .item .v{margin-top:6px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
  .swatch{width:18px;height:18px;border-radius:6px;display:inline-block;border:1px solid rgba(255,255,255,0.4);box-shadow:0 0 10px currentColor}

  .detail{margin-top:16px;border-top:1px dashed var(--border);padding-top:16px}
  .detail h4{font-size:14px;color:var(--accent);margin-bottom:8px;letter-spacing:1px}
  .detail p{font-size:14px;color:var(--text);text-align:justify}
  .detail .yiji{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:13px;color:var(--text-dim)}
  .detail .yiji b{color:var(--text)}
  .quote{margin-top:14px;font-style:italic;color:var(--ice);font-size:14px;border-left:3px solid var(--primary);padding-left:12px}

  /* 配对 */
  .pair-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
  @media(max-width:640px){.pair-grid{grid-template-columns:1fr}}
  .pair-sel{display:flex;flex-direction:column;gap:8px;align-items:center}
  .pair-sel select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);
    border-radius:12px;padding:11px;font-family:inherit;color-scheme:dark}
  .pair-sel .psym{font-size:40px}
  .pair-mid{text-align:center;font-size:22px;color:var(--accent)}
  .pair-result{margin-top:16px;border:1px solid var(--border);border-radius:18px;background:var(--card-strong);padding:18px}
  .pair-result .score{font-family:"Orbitron",sans-serif;font-size:40px;color:var(--accent);text-align:center}
  .pair-result .lv{text-align:center;font-weight:700;color:var(--accent);margin-top:2px}
  .pair-result p{margin-top:10px;font-size:14px;color:var(--text);text-align:justify}

  footer{margin-top:40px;text-align:center;color:var(--text-dim);font-size:12px;line-height:1.8}
  footer a{color:var(--ice);text-decoration:none}

  .fade{animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="nebula"></div>

<div class="wrap">
  <header class="hero">
    <div class="badge">Zodiac Oracle</div>
    <h1>星语 · 星座运势</h1>
    <p>仰望星空，读懂今日属于你的能量</p>
  </header>

  <div class="section-title"><span class="dot"></span><h2>选择你的星座</h2><span class="line"></span></div>
  <div class="grid" id="grid"></div>
  <div class="tools">
    <label>🎂 生日识别：
      <input type="date" id="bday" />
    </label>
    <span class="hint" id="bdayHint">输入生日自动匹配星座</span>
  </div>

  <div class="section-title"><span class="dot"></span><h2>今日运势</h2><span class="line"></span></div>
  <div class="panel" id="panel"></div>

  <div class="section-title"><span class="dot"></span><h2>星座配对</h2><span class="line"></span></div>
  <div class="panel">
    <div class="pair-grid">
      <div class="pair-sel">
        <div class="psym" id="psymA">♈</div>
        <select id="selA"></select>
      </div>
      <div class="pair-mid">✕</div>
      <div class="pair-sel">
        <div class="psym" id="psymB">♎</div>
        <select id="selB"></select>
      </div>
    </div>
    <div class="pair-result" id="pairResult"></div>
  </div>

  <footer>
    星语 · 星座运势 ｜ 运势内容由算法基于日期与星座确定生成，仅供娱乐参考，请勿替代专业建议。<br/>
    本地运行，数据仅存储于你的浏览器（localStorage）。
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 星座数据 ---------- */
  var CONSTELLATIONS = [
    {key:'aries',   name:'白羊座', symbol:'♈', el:'火', start:[3,21], end:[4,19], planet:'火星',   color:'#FF6B5C', trait:'热情直率'},
    {key:'taurus',  name:'金牛座', symbol:'♉', el:'土', start:[4,20], end:[5,20], planet:'金星',   color:'#7CD992', trait:'稳健踏实'},
    {key:'gemini',  name:'双子座', symbol:'♊', el:'风', start:[5,21], end:[6,21], planet:'水星',   color:'#7BE0E8', trait:'灵巧善变'},
    {key:'cancer',  name:'巨蟹座', symbol:'♋', el:'水', start:[6,22], end:[7,22], planet:'月亮',   color:'#5FA8FF', trait:'温柔顾家'},
    {key:'leo',     name:'狮子座', symbol:'♌', el:'火', start:[7,23], end:[8,22], planet:'太阳',   color:'#FFB14E', trait:'自信耀眼'},
    {key:'virgo',   name:'处女座', symbol:'♍', el:'土', start:[8,23], end:[9,22], planet:'水星',   color:'#C9D66B', trait:'细致严谨'},
    {key:'libra',   name:'天秤座', symbol:'♎', el:'风', start:[9,23], end:[10,23],planet:'金星',   color:'#C0A3FF', trait:'优雅平衡'},
    {key:'scorpio', name:'天蝎座', symbol:'♏', el:'水', start:[10,24],end:[11,22],planet:'冥王星', color:'#9B6CFF', trait:'深邃敏锐'},
    {key:'sagitt',  name:'射手座', symbol:'♐', el:'火', start:[11,23],end:[12,21],planet:'木星',   color:'#FF8A5C', trait:'自由洒脱'},
    {key:'capric',  name:'摩羯座', symbol:'♑', el:'土', start:[12,22],end:[1,19], planet:'土星',   color:'#8FB0C9', trait:'坚韧务实'},
    {key:'aquarius',name:'水瓶座', symbol:'♒', el:'风', start:[1,20], end:[2,18], planet:'天王星', color:'#6FE3D2', trait:'独立前卫'},
    {key:'pisces',  name:'双鱼座', symbol:'♓', el:'水', start:[2,19], end:[3,20], planet:'海王星', color:'#7FB2FF', trait:'浪漫多情'}
  ];
  var BY_KEY = {};
  CONSTELLATIONS.forEach(function(c){ BY_KEY[c.key]=c; });

  var LUCKY_COLORS = [
    {n:'珊瑚橙',v:'#FF7A59'},{n:'星空蓝',v:'#3E6BFF'},{n:'星云紫',v:'#7C4DFF'},
    {n:'月光银',v:'#CFD8E8'},{n:'星尘粉',v:'#F48FB1'},{n:'薄荷绿',v:'#5FD6A8'},
    {n:'暖阳金',v:'#FFD54F'},{n:'深海青',v:'#2BB6C4'},{n:'蔷薇红',v:'#FF6B8B'},
    {n:'薄雾灰',v:'#9AA7BD'},{n:'琥珀橙',v:'#FFA552'},{n:'葡萄紫',v:'#9B6CFF'}
  ];

  var QUOTES = [
    '心若向阳，无畏悲伤。','今天的你，值得被温柔以待。','慢一点，风景会更好。',
    '相信直觉，它比逻辑更早知道答案。','把注意力放在能改变的事上。','愿你所求皆所愿，所行化坦途。',
    '微小的坚持，终会汇成星河。','允许自己偶尔停下，也是前进的一部分。','善意是一种会回流的能量。',
    '你比自己想象的更有力量。','把今天过好，就是给明天最好的礼物。','保持好奇，世界会为你留一扇窗。'
  ];

  var YI = ['表白','签约','学习','运动','理财','整理','社交','冥想','创作','旅行','表白心意','主动沟通'];
  var JI = ['冲动消费','拖延','熬夜','口舌之争','冒险投资','过度劳累','钻牛角尖','轻信他人'];

  /* ---------- 文案库（按分数档） ---------- */
  var TEXTS = {
    love:{hi:'感情运势明亮，单身者易遇心动信号，有伴者默契升温。',
          mid:'情感趋于平稳，宜以耐心经营关系，少些计较多些包容。',
          lo:'情绪略敏感，沟通时放慢节奏，避免小误会悄然升级。'},
    career:{hi:'工作节奏顺畅，灵感与执行力在线，是推进关键事项的好时机。',
          mid:'事务稳步推进，按部就班即可，留意细节处的疏漏。',
          lo:'职场易遇小阻碍，优先处理要务，暂缓争议性决策。'},
    wealth:{hi:'财气活络，正财稳健，或有意外的小额进账惊喜。',
          mid:'收支大致平衡，理性消费即可，避免冲动下单。',
          lo:'开销易超预期，今日宜记账控预算，暂缓大额支出。'},
    health:{hi:'精力充沛，状态在线，适合运动与户外放松。',
          mid:'身心平稳，注意规律作息与充足饮水。',
          lo:'易感疲惫，宜多休息，避免熬夜与过度用眼。'},
    social:{hi:'人缘走高，聚会社交中易获支持与好感。',
          mid:'人际平和，适度表达想法即可，不必强求。',
          lo:'沟通成本偏高，今日宜多听少说，避开口舌之争。'}
  };
  var DIMENSIONS = [
    {k:'love',   label:'爱情', color:'#F48FB1'},
    {k:'career', label:'事业', color:'#7C4DFF'},
    {k:'wealth', label:'财运', color:'#FFD54F'},
    {k:'health', label:'健康', color:'#4DD0E1'},
    {k:'social', label:'人际', color:'#81C784'}
  ];

  /* ---------- 确定性随机 ---------- */
  function xfnv1a(str){
    var h = 2166136261>>>0;
    for(var i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 16777619); }
    return h>>>0;
  }
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a>>>15), 1 | a);
      t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
      return ((t ^ (t>>>14))>>>0) / 4294967296;
    };
  }
  function rng(seedStr){ return mulberry32(xfnv1a(seedStr)); }
  function pick(rnd, arr){ return arr[Math.floor(rnd()*arr.length)]; }
  function tier(v){ return v>=80?'hi':(v>=65?'mid':'lo'); }

  /* ---------- 日期 / 周期 ---------- */
  function pad(n){ return n<10?'0'+n:''+n; }
  function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function weekRange(d){
    var day=(d.getDay()+6)%7; // 周一=0
    var mon=addDays(d,-day); var sun=addDays(mon,6);
    return {mon:mon,sun:sun};
  }
  function periodKey(c, mode, base){
    if(mode==='today') return ymd(base)+'|day';
    if(mode==='tomorrow') return ymd(addDays(base,1))+'|day';
    if(mode==='week'){ var w=weekRange(base); return base.getFullYear()+'-W'+pad(weekNum(base))+'|wk'; }
    if(mode==='month') return base.getFullYear()+'-'+pad(base.getMonth()+1)+'|mo';
    return ymd(base);
  }
  function weekNum(d){
    var t=new Date(d.getFullYear(),0,1); var day=(t.getDay()+6)%7;
    var days=Math.floor((d-t)/86400000)+day; return Math.floor(days/7)+1;
  }
  function periodLabel(mode, base){
    if(mode==='today') return '今日 · '+ (base.getMonth()+1)+'月'+base.getDate()+'日';
    if(mode==='tomorrow'){ var t=addDays(base,1); return '明日 · '+ (t.getMonth()+1)+'月'+t.getDate()+'日'; }
    if(mode==='week'){ var w=weekRange(base);
      return '本周 · '+ (w.mon.getMonth()+1)+'.'+w.mon.getDate()+'–'+(w.sun.getMonth()+1)+'.'+w.sun.getDate(); }
    if(mode==='month') return '本月 · '+base.getFullYear()+'年'+(base.getMonth()+1)+'月';
    return '';
  }

  /* ---------- 运势生成 ---------- */
  function genFortune(c, mode, base){
    var seed = 'F|'+c.key+'|'+periodKey(c,mode,base);
    var r = rng(seed);
    var overall = 55 + Math.floor(r()*45);          // 55-99
    var dim = {};
    DIMENSIONS.forEach(function(d){ dim[d.k] = 50 + Math.floor(r()*50); }); // 50-99
    var luckyNum = 1 + Math.floor(r()*9);
    var luckyColor = pick(r, LUCKY_COLORS);
    var pool = CONSTELLATIONS.filter(function(x){ return x.key!==c.key; });
    var pairC = pick(r, pool);
    var quote = pick(r, QUOTES);
    var yi = pick(r, YI), ji = pick(r, JI);
    // 详解文案
    var detail = DIMENSIONS.map(function(d){
      return TEXTS[d.k][tier(dim[d.k])];
    }).join('');
    return {overall:overall, dim:dim, luckyNum:luckyNum, luckyColor:luckyColor,
            pair:c.name+' × '+pairC.name, pairKey:pairC.key, quote:quote, yi:yi, ji:ji, detail:detail};
  }

  /* ---------- 星座配对 ---------- */
  var ELEM_BASE = {
    '火-火':90,'火-风':85,'火-土':65,'火-水':55,
    '土-土':88,'土-水':85,'土-风':60,'土-火':65,
    '风-风':88,'风-水':68,'风-火':85,'风-土':60,
    '水-水':90,'水-火':55,'水-土':85,'水-风':68
  };
  function elemPair(a,b){
    var key=a+'-'+b; if(ELEM_BASE[key]!=null) return ELEM_BASE[key];
    return ELEM_BASE[b+'-'+a];
  }
  function genPair(ca, cb, base){
    var baseScore = elemPair(ca.el, cb.el);
    var keys=[ca.key,cb.key].sort();
    var r = rng('P|'+keys[0]+'|'+keys[1]+'|'+base.getFullYear()+'-'+pad(base.getMonth()+1));
    var score = baseScore + Math.floor((r()-0.5)*18);
    score = Math.max(40, Math.min(99, score));
    var lv, desc;
    if(score>=85){ lv='天作之合'; desc='你们的气场高度契合，'+ca.el+'象与'+cb.el+'象的能量彼此激荡，默契仿佛与生俱来。多制造共同回忆，关系会更上一层楼。'; }
    else if(score>=70){ lv='默契搭档'; desc='你们优势互补，'+ca.name+'的特质与'+cb.name+'相映成趣。只需在节奏上稍作磨合，便能形成稳定而温暖的连接。'; }
    else if(score>=55){ lv='需要磨合'; desc='差异是你们的功课。'+ca.name+'偏'+ca.trait+'，'+cb.name+'偏'+cb.trait+'，多换位思考、少些执念，关系会慢慢升温。'; }
    else { lv='谨慎相处'; desc='你们的步调与需求存在差异，'+ca.el+'象与'+cb.el+'象的张力需要耐心化解。保持边界感与沟通，反而能少些摩擦。'; }
    return {score:score, lv:lv, desc:desc};
  }

  /* ---------- 生日 → 星座 ---------- */
  function constellationOf(month, day){
    for(var i=0;i<CONSTELLATIONS.length;i++){
      var c=CONSTELLATIONS[i];
      var s=c.start, e=c.end;
      var cur=month*100+day, sc=s[0]*100+s[1], ec=e[0]*100+e[1];
      if(sc<=ec){ if(cur>=sc && cur<=ec) return c; }
      else { if(cur>=sc || cur<=ec) return c; } // 跨年（摩羯）
    }
    return CONSTELLATIONS[0];
  }

  /* ---------- 渲染 ---------- */
  var current = {key:'leo', mode:'today'};
  var TODAY = new Date();

  function setAccent(c){
    var root=document.documentElement.style;
    root.setProperty('--accent-element', c.color);
    root.setProperty('--c-glow', hexA(c.color,0.5));
  }

  function renderGrid(){
    var grid=document.getElementById('grid');
    grid.innerHTML='';
    CONSTELLATIONS.forEach(function(c){
      var card=document.createElement('div');
      card.className='c-card'+(c.key===current.key?' active':'');
      card.style.setProperty('--c-accent', c.color);
      card.style.setProperty('--c-glow', hexA(c.color,0.5));
      card.style.setProperty('--c-soft', hexA(c.color,0.18));
      card.style.setProperty('--c-border', hexA(c.color,0.4));
      card.innerHTML='<span class="el">'+c.el+'象</span>'+
        '<div class="sym">'+c.symbol+'</div>'+
        '<div class="nm">'+c.name+'</div>'+
        '<div class="dt">'+c.start[1]+'/'+c.start[0]+'–'+c.end[1]+'/'+c.end[0]+'</div>';
      card.addEventListener('click', function(){ selectConstellation(c.key); });
      grid.appendChild(card);
    });
  }

  function renderPanel(){
    var c=BY_KEY[current.key];
    setAccent(c);
    var f=genFortune(c, current.mode, TODAY);
    var panel=document.getElementById('panel');
    var R=52, C=2*Math.PI*R;
    var off=C*(1-f.overall/100);
    var barsHtml = DIMENSIONS.map(function(d){
      var v=f.dim[d.k];
      return '<div class="bar-row"><div class="bl">'+d.label+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+v+'%;background:linear-gradient(90deg,'+d.color+',#fff3)"></div></div>'+
        '<div class="bv">'+v+'</div></div>';
    }).join('');
    var lvText = f.overall>=85?'大吉':(f.overall>=70?'中吉':(f.overall>=60?'小吉':'平'));
    panel.innerHTML =
      '<div class="panel-head fade">'+
        '<div class="big-sym">'+c.symbol+'</div>'+
        '<div class="meta"><h3>'+c.name+'</h3>'+
          '<div class="sub">'+periodLabel(current.mode, TODAY)+' ｜ 守护星 '+c.planet+'</div>'+
          '<div class="tags"><span class="tag">'+c.el+'象星座</span><span class="tag">'+c.trait+'</span></div>'+
        '</div>'+
      '</div>'+
      '<div class="period-tabs" id="tabs">'+
        ['today','tomorrow','week','month'].map(function(m){
          return '<button data-m="'+m+'" class="'+(m===current.mode?'active':'')+'">'+
            ({today:'今日',tomorrow:'明日',week:'本周',month:'本月'})[m]+'</button>';
        }).join('')+
      '</div>'+
      '<div class="overall fade">'+
        '<div class="ring"><svg width="120" height="120">'+
          '<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="10"/>'+
          '<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="'+c.color+'" stroke-width="10" stroke-linecap="round" '+
            'stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" style="filter:drop-shadow(0 0 6px '+c.color+')"/>'+
        '</svg><div class="num"><b>'+f.overall+'</b><span>综合指数</span></div></div>'+
        '<div class="desc"><div class="lv">'+lvText+' · 综合运势 '+f.overall+' 分</div>'+
          '<p>本周期你的整体能量'+ (f.overall>=80?'处于高峰，适合主动出击与重要决策':(f.overall>=65?'平稳向好，按节奏推进即可':'趋于内敛，宜守不宜攻，重在沉淀')) +'。</p></div>'+
      '</div>'+
      '<div class="bars fade">'+barsHtml+'</div>'+
      '<div class="lucky fade">'+
        '<div class="item"><div class="k">幸运数字</div><div class="v">'+f.luckyNum+'</div></div>'+
        '<div class="item"><div class="k">幸运颜色</div><div class="v"><span class="swatch" style="background:'+f.luckyColor.v+';color:'+f.luckyColor.v+'"></span>'+f.luckyColor.n+'</div></div>'+
        '<div class="item"><div class="k">速配星座</div><div class="v">'+f.pair+'</div></div>'+
      '</div>'+
      '<div class="detail fade"><h4>📜 运势详解</h4><p>'+f.detail+'</p>'+
        '<div class="yiji"><span>宜：<b>'+f.yi+'</b></span><span>忌：<b>'+f.ji+'</b></span></div>'+
        '<div class="quote">「'+f.quote+'」</div>'+
      '</div>';
    // 绑定周期切换
    Array.prototype.forEach.call(panel.querySelectorAll('#tabs button'), function(b){
      b.addEventListener('click', function(){
        current.mode=b.getAttribute('data-m');
        renderPanel();
        try{ localStorage.setItem('star.mode', current.mode); }catch(e){}
      });
    });
  }

  function renderPair(){
    var a=BY_KEY[document.getElementById('selA').value];
    var b=BY_KEY[document.getElementById('selB').value];
    document.getElementById('psymA').textContent=a.symbol;
    document.getElementById('psymB').textContent=b.symbol;
    var p=genPair(a,b,TODAY);
    document.getElementById('pairResult').innerHTML=
      '<div class="score">'+p.score+'<span style="font-size:18px"> 分</span></div>'+
      '<div class="lv">'+p.lv+'</div><p>'+p.desc+'</p>';
  }

  function selectConstellation(key){
    current.key=key;
    setAccent(BY_KEY[key]);
    renderGrid(); renderPanel();
    try{ localStorage.setItem('star.key', key); }catch(e){}
  }

  function initPairSelectors(){
    var sa=document.getElementById('selA'), sb=document.getElementById('selB');
    CONSTELLATIONS.forEach(function(c){
      sa.appendChild(new Option(c.symbol+' '+c.name, c.key));
      sb.appendChild(new Option(c.symbol+' '+c.name, c.key));
    });
    sa.value='aries'; sb.value='libra';
    sa.addEventListener('change', renderPair);
    sb.addEventListener('change', renderPair);
  }

  /* ---------- 工具函数 ---------- */
  function hexA(hex, a){
    hex=hex.replace('#','');
    if(hex.length===3) hex=hex.split('').map(function(x){return x+x;}).join('');
    var r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }
  function eltRand(){ return Math.random(); }

  /* ---------- 生日识别 ---------- */
  function initBirthday(){
    var inp=document.getElementById('bday');
    var hint=document.getElementById('bdayHint');
    try{ var saved=localStorage.getItem('star.bday'); if(saved) inp.value=saved; }catch(e){}
    inp.addEventListener('change', function(){
      if(!inp.value){ hint.textContent='输入生日自动匹配星座'; return; }
      var p=inp.value.split('-'); var m=+p[1], d=+p[2];
      var c=constellationOf(m,d);
      selectConstellation(c.key);
      hint.textContent='已识别为 '+c.name+'（'+c.start[1]+'/'+c.start[0]+'–'+c.end[1]+'/'+c.end[0]+'）';
      try{ localStorage.setItem('star.bday', inp.value); }catch(e){}
      document.querySelector('.section-title').scrollIntoView({behavior:'smooth'});
    });
  }

  /* ---------- 星空背景 ---------- */
  function starfield(){
    var cv=document.getElementById('stars'), ctx=cv.getContext('2d');
    var stars=[], shoot=null, lastShoot=0;
    function resize(){ cv.width=innerWidth; cv.height=innerHeight; build(); }
    function build(){
      stars=[]; var n=Math.round(innerWidth*innerHeight/9000);
      for(var i=0;i<n;i++){
        stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,
          r:Math.random()*1.4+0.3, a:Math.random(), s:Math.random()*0.02+0.004,
          hue: Math.random()<0.2 ? 45 : (Math.random()<0.5?210:270)});
      }
    }
    function tick(t){
      ctx.clearRect(0,0,cv.width,cv.height);
      for(var i=0;i<stars.length;i++){
        var st=stars[i]; st.a+=st.s; var tw=0.5+0.5*Math.sin(st.a);
        ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,Math.PI*2);
        ctx.fillStyle='hsla('+st.hue+',80%,'+(70+tw*20)+'%,'+(0.3+tw*0.7)+')';
        ctx.shadowBlur=6; ctx.shadowColor='hsla('+st.hue+',90%,80%,0.8)';
        ctx.fill();
      }
      ctx.shadowBlur=0;
      if(t-lastShoot>4000 && Math.random()<0.01){ shoot={x:-50,y:Math.random()*cv.height*0.5,len:0}; lastShoot=t; }
      if(shoot){
        shoot.x+=12; shoot.y+=6; shoot.len+=12;
        var g=ctx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.len,shoot.y-shoot.len*0.5);
        g.addColorStop(0,'rgba(255,255,255,0.9)'); g.addColorStop(1,'rgba(255,255,255,0)');
        ctx.strokeStyle=g; ctx.lineWidth=2; ctx.beginPath();
        ctx.moveTo(shoot.x,shoot.y); ctx.lineTo(shoot.x-shoot.len,shoot.y-shoot.len*0.5); ctx.stroke();
        if(shoot.x>cv.width+60) shoot=null;
      }
      requestAnimationFrame(tick);
    }
    addEventListener('resize', resize); resize(); requestAnimationFrame(tick);
  }

  /* ---------- 启动 ---------- */
  function init(){
    try{
      var k=localStorage.getItem('star.key'); if(k&&BY_KEY[k]) current.key=k;
      var m=localStorage.getItem('star.mode'); if(m) current.mode=m;
    }catch(e){}
    renderGrid();
    initPairSelectors();
    initBirthday();
    renderPanel();
    renderPair();
    starfield();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
